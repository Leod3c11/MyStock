plugins {
    id "com.android.application"
}

android {
    namespace "com.mystock.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.mystock.app"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "2.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
        }
    }
}
